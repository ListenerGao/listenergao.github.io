<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>图片上传 · ListenerGao</title>
<style>
:root {
  --bg: #fafafa;
  --board: #ffffff;
  --text: #374151;
  --heading: #111827;
  --sec-text: #6b7280;
  --line: #e5e7eb;
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-soft: #f0fdfa;
  --danger: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --board: #1a1f28;
    --text: #c2c9d2;
    --heading: #e2e8f0;
    --sec-text: #94a3b8;
    --line: #2b323d;
    --accent: #2dd4bf;
    --accent-hover: #5eead4;
    --accent-soft: #16302f;
    --danger: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 48px 20px 80px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { margin: 0 0 8px; font-size: 26px; color: var(--heading); font-weight: 600; }
.lead { margin: 0 0 32px; color: var(--sec-text); font-size: 15px; }
.board {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
}
label { display: block; font-size: 14px; color: var(--sec-text); margin-bottom: 6px; }
input[type=text] {
  width: 100%; padding: 10px 12px; font: inherit; font-size: 15px;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; outline: none;
}
input:focus { border-color: var(--accent); }
button {
  font: inherit; font-size: 15px; padding: 10px 20px; cursor: pointer;
  color: #fff; background: var(--accent); border: none; border-radius: 8px;
}
button:hover { background: var(--accent-hover); }

/* 登录状态过期提示 */
#notice {
  display: none; margin-bottom: 20px; padding: 12px 16px;
  border: 1px solid var(--danger); border-radius: 8px;
  color: var(--danger); font-size: 14px;
}
#notice.show { display: block; }

.slug-row { margin-bottom: 20px; }
.hint { font-size: 13px; color: var(--sec-text); margin-top: 6px; }
#drop {
  border: 2px dashed var(--line); border-radius: 12px;
  padding: 48px 24px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s;
}
#drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop .big { font-size: 16px; color: var(--heading); margin-bottom: 6px; }
#drop .small { font-size: 13px; color: var(--sec-text); }

/* 结果 */
#results { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
.item {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--board); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px;
}
.item img {
  width: 56px; height: 56px; object-fit: cover;
  border-radius: 6px; border: 1px solid var(--line); flex-shrink: 0; background: var(--bg);
}
.item .meta { flex: 1; min-width: 0; }
.item .name { font-size: 14px; color: var(--heading); margin-bottom: 4px; word-break: break-all; }
.item .status { font-size: 13px; color: var(--sec-text); }
.item .status.fail { color: var(--danger); }
.copy-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.copy-row code {
  flex: 1; min-width: 0; font-size: 12px; padding: 5px 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  overflow-x: auto; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.copy-row button {
  flex-shrink: 0; padding: 5px 12px; font-size: 13px;
  background: transparent; color: var(--accent); border: 1px solid var(--line);
}
.copy-row button:hover { background: var(--accent-soft); }
.footer { margin-top: 40px; font-size: 13px; color: var(--sec-text); text-align: center; }
.footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>图片上传</h1>
  <p class="lead">上传到 R2 图床，返回公开链接和 Markdown 引用。</p>

  <div id="notice">登录状态已过期，<a href="" onclick="location.reload();return false">刷新页面</a>重新登录后再试。</div>

  <div>
    <div class="slug-row">
      <label for="slug">归类目录（可选）</label>
      <input type="text" id="slug" placeholder="例如 ai-music-01">
      <div class="hint">留空则存到 <code id="path-preview"></code>，填了则多一层子目录。</div>
    </div>

    <div id="drop">
      <div class="big">拖拽图片到这里</div>
      <div class="small">也可以直接 Cmd+V 粘贴截图，或点击选择文件</div>
      <input type="file" id="picker" accept="image/*" multiple hidden>
    </div>

    <div id="results"></div>
  </div>

  <div class="footer"><a href="/">← 返回博客</a></div>
</div>

<script>
(function () {
  // 鉴权由 Cloudflare Access 在边缘完成，页面本身不碰任何凭证。
  // 能打开这个页面就说明已认证，fetch 会自动带上 Access 的会话 cookie。
  const notice = document.getElementById('notice')
  const drop = document.getElementById('drop')
  const picker = document.getElementById('picker')
  const results = document.getElementById('results')
  const slugInput = document.getElementById('slug')

  const now = new Date()
  document.getElementById('path-preview').textContent =
    now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/'

  function copyButton(text, label) {
    const row = document.createElement('div')
    row.className = 'copy-row'
    const code = document.createElement('code')
    code.textContent = text
    const btn = document.createElement('button')
    btn.textContent = label
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text)
        btn.textContent = '已复制'
        setTimeout(() => { btn.textContent = label }, 1500)
      } catch { btn.textContent = '复制失败' }
    })
    row.append(code, btn)
    return row
  }

  async function upload(file) {
    const item = document.createElement('div')
    item.className = 'item'
    const thumb = document.createElement('img')
    thumb.src = URL.createObjectURL(file)
    const meta = document.createElement('div')
    meta.className = 'meta'
    const name = document.createElement('div')
    name.className = 'name'
    name.textContent = file.name || '(剪贴板图片)'
    const status = document.createElement('div')
    status.className = 'status'
    status.textContent = '上传中… ' + (file.size / 1024).toFixed(1) + ' KB'
    meta.append(name, status)
    item.append(thumb, meta)
    results.prepend(item)

    const form = new FormData()
    form.append('file', file, file.name || 'pasted.png')
    if (slugInput.value.trim()) form.append('slug', slugInput.value.trim())

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form })
      const data = await res.json().catch(() => ({}))

      // Access 会话过期后请求会被边缘拦下，拿不到正常的 JSON 响应
      if (res.status === 401 || res.status === 403 || res.redirected) {
        status.className = 'status fail'
        status.textContent = '登录状态已过期'
        notice.classList.add('show')
        return
      }
      if (!res.ok) {
        status.className = 'status fail'
        status.textContent = data.error || ('上传失败 HTTP ' + res.status)
        return
      }

      status.textContent = (data.size / 1024).toFixed(1) + ' KB  ·  ' + data.key
      meta.append(copyButton(data.url, '复制链接'))
      meta.append(copyButton('![](' + data.url + ')', '复制 Markdown'))
    } catch (e) {
      status.className = 'status fail'
      status.textContent = '上传出错：' + e.message
    }
  }

  async function uploadAll(files) {
    const images = [...files].filter(f => f.type.startsWith('image/'))
    if (!images.length) return
    for (const file of images) await upload(file)
  }

  drop.addEventListener('click', () => picker.click())
  picker.addEventListener('change', () => { uploadAll(picker.files); picker.value = '' })

  ;['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over') }))
  ;['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over') }))
  drop.addEventListener('drop', e => uploadAll(e.dataTransfer.files))

  document.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.items || [])]
      .filter(i => i.kind === 'file')
      .map(i => i.getAsFile())
      .filter(Boolean)
    if (files.length) { e.preventDefault(); uploadAll(files) }
  })
})()
</script>
</body>
</html>
